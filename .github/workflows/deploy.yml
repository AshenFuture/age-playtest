name: Deploy to Cloudflare Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: pages-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 012b7435905a294c8d14310466682589
    steps:
      - uses: actions/checkout@v4
      - name: Skip if no token yet
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::warning::CLOUDFLARE_API_TOKEN secret not set, skipping deploy"
      # Never roll the launcher back: a deploy whose launcher-version.json is older than the live one
      # (e.g. main missing a release that went out another way) would trip the tamper alarm and pause
      # downloads. Every launcher release goes through main; fix main instead of deploying.
      - name: Refuse a launcher rollback
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          live=$(curl -fsS "https://age-playtest-site.pages.dev/launcher-version.json?ci=$GITHUB_RUN_ID" | jq -r .version || echo 0)
          new=$(jq -r .version launcher-version.json)
          echo "live launcher $live, this deploy $new"
          if [ "$(printf '%s\n%s\n' "$live" "$new" | sort -V | head -1)" != "$live" ]; then
            echo "::error::launcher-version.json $new is older than the live $live. Put the newer release on main first."; exit 1
          fi
      - name: Deploy repo to age-playtest-site
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: mkdir dist && git archive HEAD | tar -x -C dist && rm -rf dist/.github && npx --yes wrangler@4 pages deploy dist --project-name=age-playtest-site --branch=main --commit-hash="$GITHUB_SHA" --commit-message="$(git log -1 --pretty=%s)" --commit-dirty=true
