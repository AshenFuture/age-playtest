<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cycles of Genesis playtest</title>
<meta name="description" content="Closed playtest of Cycles of Genesis by Dark Oasis Games.">
<meta name="theme-color" content="#03060c">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--cyan:#5FD4FF;--cyan-a:rgba(95,212,255,.35);--text:#E6F2FA;--dim:#8AA4B6;--faint:#56707F;--amber:#FFC46B;--green:#5CF2A0;--glass:rgba(8,18,32,.74);--bg:#020409}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--text);font:500 17px/1.45 Rajdhani,"Segoe UI",system-ui,sans-serif;background:transparent;overflow-x:hidden;-webkit-font-smoothing:antialiased}
/* space backdrop: two star layers + a slowly turning blue planet */
.sky{position:fixed;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(ellipse at 70% 120%,#06142a 0,#020409 60%)}
.stars,.stars2{position:absolute;inset:-50%;background-repeat:repeat}
.stars{background-image:radial-gradient(1px 1px at 20px 30px,#fff,transparent),radial-gradient(1px 1px at 120px 80px,#cfe9ff,transparent),radial-gradient(1px 1px at 200px 160px,#fff,transparent),radial-gradient(1.5px 1.5px at 300px 40px,#9fdcff,transparent),radial-gradient(1px 1px at 380px 260px,#fff,transparent),radial-gradient(1px 1px at 60px 300px,#dff,transparent),radial-gradient(1px 1px at 250px 350px,#fff,transparent);background-size:420px 420px;opacity:.75;animation:drift 240s linear infinite}
.stars2{background-image:radial-gradient(1px 1px at 50px 90px,#fff,transparent),radial-gradient(1px 1px at 170px 210px,#bfe6ff,transparent),radial-gradient(2px 2px at 330px 120px,#fff,transparent),radial-gradient(1px 1px at 410px 330px,#fff,transparent);background-size:520px 520px;opacity:.45;animation:drift 420s linear infinite reverse}
@keyframes drift{to{transform:translate(210px,105px)}}
.planet{position:absolute;width:min(92vw,880px);aspect-ratio:1;right:-26vw;bottom:-46vw;border-radius:50%;
 background:radial-gradient(circle at 30% 26%,#3a8fc8 0,#16518f 16%,#0a2a55 38%,#04132b 60%,#01050d 78%);
 box-shadow:0 0 90px 18px rgba(95,212,255,.12),inset 14px 10px 30px rgba(140,220,255,.25),inset -80px -60px 140px rgba(0,0,0,.85)}
.planet:after{content:"";position:absolute;inset:0;border-radius:50%;opacity:.14;mix-blend-mode:screen;
 background:repeating-linear-gradient(170deg,transparent 0 22px,rgba(255,255,255,.18) 26px,transparent 34px),repeating-linear-gradient(20deg,transparent 0 40px,rgba(190,235,255,.12) 46px,transparent 60px);
 background-size:200% 100%;animation:turn 90s linear infinite;-webkit-mask:radial-gradient(circle at 40% 35%,#000 40%,transparent 70%);mask:radial-gradient(circle at 40% 35%,#000 40%,transparent 70%)}
@keyframes turn{to{background-position:200% 0}}
@media (min-width:900px){.planet{right:-14vw;bottom:-30vw;width:62vw}}
@media (prefers-reduced-motion:reduce){.stars,.stars2,.planet:after{animation:none}}
.wrap{max-width:860px;margin:0 auto;padding:max(22px,env(safe-area-inset-top)) 16px 64px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
.logo{font:700 46px/1 Rajdhani,sans-serif;letter-spacing:.32em;color:#fff;text-shadow:0 0 18px rgba(95,212,255,.85),0 0 42px rgba(95,212,255,.45);margin:0;padding-left:.1em}
.logo .pre{display:block;font-size:.3em;letter-spacing:.55em;margin:0 0 6px;color:#cfeeff;text-transform:uppercase}
.tag{font:600 13px Rajdhani;letter-spacing:.3em;text-transform:uppercase;color:var(--dim)}
.who{font:600 14px Rajdhani;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);text-align:right}
.who a{color:var(--cyan);text-decoration:none;cursor:pointer}
/* glass panel, 1px frame, bright corner brackets, square corners */
.panel{position:relative;background:var(--glass);border:1px solid var(--cyan-a);padding:20px;margin:0 0 16px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.panel:before{content:"";position:absolute;inset:-2px;pointer-events:none;background:
 linear-gradient(var(--cyan),var(--cyan)) top left/18px 2px,linear-gradient(var(--cyan),var(--cyan)) top left/2px 18px,
 linear-gradient(var(--cyan),var(--cyan)) top right/18px 2px,linear-gradient(var(--cyan),var(--cyan)) top right/2px 18px,
 linear-gradient(var(--cyan),var(--cyan)) bottom left/18px 2px,linear-gradient(var(--cyan),var(--cyan)) bottom left/2px 18px,
 linear-gradient(var(--cyan),var(--cyan)) bottom right/18px 2px,linear-gradient(var(--cyan),var(--cyan)) bottom right/2px 18px;background-repeat:no-repeat;filter:drop-shadow(0 0 4px rgba(95,212,255,.7))}
h2{font:700 26px/1.1 Rajdhani;letter-spacing:.2em;text-transform:uppercase;margin:0 0 6px;color:#fff}
h3{font:700 15px Rajdhani;letter-spacing:.3em;text-transform:uppercase;color:var(--cyan);margin:28px 0 10px;text-shadow:0 0 10px rgba(95,212,255,.45)}
h4{font:700 15px Rajdhani;letter-spacing:.14em;text-transform:uppercase;margin:0 0 4px}
p{margin:6px 0}
.dim{color:var(--dim)}.faint{color:var(--faint);font-size:14px}
.btn{display:flex;align-items:center;gap:12px;width:100%;max-width:420px;margin:14px 0 4px;padding:15px 18px;border:0;border-left:3px solid var(--cyan);
 background:linear-gradient(90deg,rgba(95,212,255,.30),rgba(95,212,255,.06) 70%,rgba(95,212,255,.02));color:var(--text);
 font:700 19px Rajdhani;letter-spacing:.24em;text-transform:uppercase;text-align:left;text-decoration:none;cursor:pointer;transition:color .15s,box-shadow .15s,background .15s}
.btn:hover,.btn:focus-visible{color:#fff;background:linear-gradient(90deg,rgba(95,212,255,.45),rgba(95,212,255,.10) 70%,rgba(95,212,255,.03));box-shadow:0 0 22px rgba(95,212,255,.35);outline:none}
.btn:active{transform:translateY(2px)}
.btn.big{font-size:22px;padding:18px 20px}
.btn.alt{border-left-color:#8C9BFF;background:linear-gradient(90deg,rgba(120,135,255,.28),rgba(120,135,255,.05) 70%,transparent)}
.btn svg{width:22px;height:22px;flex:none;fill:currentColor}
.btn[disabled]{opacity:.5;cursor:wait}
.row{display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-bottom:1px solid rgba(95,212,255,.08)}
.row:last-child{border-bottom:0}.row span:last-child{color:var(--dim);white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.grid .panel{margin:0;padding:14px 16px}
.pts{color:var(--amber)}.trophy{color:var(--green)}
ol.steps{margin:0;padding-left:22px}ol.steps li{margin:7px 0}
ol.steps b,.hl{color:var(--cyan);font-weight:700}
ul{margin:6px 0;padding-left:20px}li{margin:3px 0}
.cat{margin:10px 0}.cat b{font:700 13px Rajdhani;letter-spacing:.22em;text-transform:uppercase;color:var(--green)}
a{color:var(--cyan)}
details{border-top:1px solid rgba(95,212,255,.15);padding:10px 0}summary{cursor:pointer;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.note{border-left:3px solid var(--amber);padding:10px 14px;background:rgba(255,196,107,.07);margin:12px 0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--glass);border:1px solid var(--cyan-a);padding:10px 16px;font-weight:600;letter-spacing:.1em;display:none}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--cyan);border-right-color:transparent;border-radius:50%;animation:sp 1s linear infinite;vertical-align:-2px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
footer{margin-top:36px;color:var(--faint);font-size:14px;letter-spacing:.08em}
@media (max-width:560px){body{font-size:16px}.logo{font-size:38px}.panel{padding:16px}.btn{max-width:none}h2{font-size:22px}header{align-items:flex-start}}
</style>
<!--CFG--><script>var AGE_CFG={mode:"static",api:"https://script.google.com/macros/s/AKfycbwn0l1CTARsiFoh4kg3GSoG4jpKoVnlf0adAQ4S2ltLInWNQA0Z52X8t9k4m94AWrSIzg/exec"};</script><!--/CFG-->
</head>
<body>
<div class="sky" aria-hidden="true"><div class="stars"></div><div class="stars2"></div><div class="planet"></div></div>
<div class="wrap">
<header><div><h1 class="logo"><span class="pre">Cycles of</span>GENESIS</h1><div class="tag">Closed playtest</div></div><div class="who" id="who"></div></header>
<main id="app"><div class="panel"><span class="spin"></span>Loading…</div></main>
<footer>Cycles of Genesis by Dark Oasis Games · <a id="discordFoot" target="_blank" rel="noopener">Discord</a></footer>
</div>
<div class="toast" id="toast"></div>
<script>
(function(){
var C=window.AGE_CFG||{},app=document.getElementById("app"),whoEl=document.getElementById("who"),D=null,TOK=null;
var DISCORD="https://discord.gg/w9Rv7sPRG";
var MOBILE=/Android|iPhone|iPad|iPod|Mobi/i.test(navigator.userAgent)||(navigator.maxTouchPoints>1&&/Macintosh/.test(navigator.userAgent));
var ICON_STEAM='<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-9.96 9.14l5.36 2.22a2.83 2.83 0 0 1 1.6-.49h.16l2.39-3.46v-.05a3.78 3.78 0 1 1 3.78 3.78h-.09l-3.4 2.43v.13a2.84 2.84 0 0 1-5.62.57L2.4 14.7A10 10 0 1 0 12 2zm-4.28 15.2-1.23-.5a2.13 2.13 0 1 0 1.17-2.9l1.27.52a1.57 1.57 0 1 1-1.2 2.9zm9.48-7.84a2.52 2.52 0 1 0-2.52 2.52 2.52 2.52 0 0 0 2.52-2.52zm-4.4 0a1.89 1.89 0 1 1 1.88 1.89 1.89 1.89 0 0 1-1.88-1.89z"/></svg>';
var ICON_DC='<svg viewBox="0 0 24 24"><path d="M20.3 4.4A19.8 19.8 0 0 0 15.4 3l-.6 1.3a18.4 18.4 0 0 0-5.6 0L8.6 3a19.7 19.7 0 0 0-4.9 1.4C.6 9 0 13.6.3 18.1a19.9 19.9 0 0 0 6 3l1.3-2.1a13 13 0 0 1-2-1l.5-.4a14.2 14.2 0 0 0 12.2 0l.5.4c-.6.4-1.3.7-2 1l1.3 2.1a19.8 19.8 0 0 0 6-3c.5-5.2-.8-9.7-3.8-13.7zM8.5 15.4c-1.2 0-2.2-1.1-2.2-2.4s1-2.4 2.2-2.4 2.2 1.1 2.2 2.4-1 2.4-2.2 2.4zm7 0c-1.2 0-2.2-1.1-2.2-2.4s1-2.4 2.2-2.4 2.2 1.1 2.2 2.4-1 2.4-2.2 2.4z"/></svg>';
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return "&#"+c.charCodeAt(0)+";"})}
function toast(t){var e=document.getElementById("toast");e.textContent=t;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(function(){e.style.display="none"},2600)}
function store(k,v){try{if(v==null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){}}
function load(k){try{return localStorage.getItem(k)}catch(e){return null}}
function vid(){var v=load("agevid");if(!v){v=Math.random().toString(36).slice(2,10);store("agevid",v)}return v}
function meta(){return {visitor:vid(),ua:navigator.userAgent,lang:navigator.language,tz:(Intl.DateTimeFormat().resolvedOptions().timeZone||""),screen:screen.width+"x"+screen.height,ref:document.referrer,src:C.src||"site"}}
function api(op,p){p=Object.assign({op:op},meta(),p||{});if(TOK)p.token=TOK;
 if(C.mode==="gas")return new Promise(function(res,rej){google.script.run.withSuccessHandler(res).withFailureHandler(rej).siteApi(p)});
 var q=new URLSearchParams(p);q.set("action","site");return fetch(C.api+"?"+q.toString()).then(function(r){return r.json()})}
function selfUrl(){return C.mode==="gas"?C.self:location.origin+location.pathname}
function steamUrl(){var rt=selfUrl()+(C.mode==="gas"?"?page=download":""),realm=C.mode==="gas"?"https://script.google.com":location.origin;
 var q={"openid.ns":"http://specs.openid.net/auth/2.0","openid.mode":"checkid_setup","openid.return_to":rt,"openid.realm":realm,"openid.identity":"http://specs.openid.net/auth/2.0/identifier_select","openid.claimed_id":"http://specs.openid.net/auth/2.0/identifier_select"};
 return "https://steamcommunity.com/openid/login?"+new URLSearchParams(q).toString()}
function day(d){if(!d)return "";if(/^\d{4}-\d\d-\d\d$/.test(d))d+="T12:00:00";return new Date(d).toLocaleDateString([],{weekday:"short",month:"short",day:"numeric"})}
function discordBtn(){return '<a class="btn alt" target="_blank" rel="noopener" data-ev="discord" href="'+esc(DISCORD)+'">'+ICON_DC+'Join the Discord</a>'}
function err(e){app.innerHTML='<div class="panel"><h2>Something went wrong</h2><p class="dim">'+esc(e&&e.message||e||"Could not reach the playtest server.")+'</p><button class="btn" id="retry">Try again</button></div>';document.getElementById("retry").onclick=start}
function setWho(){whoEl.innerHTML=D&&D.name?esc(D.name)+'<br><a id="out">Sign out</a>':"";var o=document.getElementById("out");if(o)o.onclick=function(){store("agetok",null);TOK=null;D=null;start()}}
function signedOut(){app.innerHTML='<div class="panel"><h2>Closed playtest</h2><p>Cycles of Genesis is in a closed playtest. Sign in with your Steam account to get the download. If you\'re on the list, it\'s right there.</p>'
 +'<a class="btn big" href="'+esc(steamUrl())+'" target="_top">'+ICON_STEAM+'Sign in with Steam</a><p class="faint">You sign in on Steam\'s own page. We only receive your public Steam ID and name, never your password.</p></div>'
 +'<div class="panel"><h4>Want in?</h4><p class="dim">Sign in once so we know your Steam account, then ask in the Discord.</p>'+discordBtn()+'</div>'}
function waiting(){var den=D.status==="denied";app.innerHTML='<div class="panel"><h2>'+(den?"Not in this round":"You're on the waiting list")+'</h2><p>Thanks, <b>'+esc(D.name)+'</b>. '
 +(den?"This playtest round is full or closed for your account. Keep an eye on the Discord for the next one.":"Your Steam account isn't on the playtest list yet. The developer has been told you asked. Say hi in the Discord to speed it up.")+'</p>'
 +discordBtn()+'<button class="btn" id="again">Check again</button></div>';document.getElementById("again").onclick=start}
function notes(n){if(!n||!n.cats||!n.cats.length)return '<p class="dim">No patch notes for this build.</p>';return n.cats.map(function(c){return '<div class="cat"><b>'+esc(c.name)+'</b><ul>'+c.items.map(function(i){return "<li>"+esc(i)+"</li>"}).join("")+'</ul></div>'}).join("")}
function dlBlock(b){if(!MOBILE)return '<a class="btn big" href="https://play.darkoasisgames.com/CyclesOfGenesisLauncher.exe" download>Download the launcher</a><p class="faint">Windows · 1 MB · installs this build, keeps it updated and switches between builds</p><p class="faint"><a href="#" data-dl="'+esc(b.name)+'">Or download the zip instead</a> ('+b.sizeMb+' MB)</p>';
 var link=selfUrl();return '<div class="note"><b>You\'re on a phone.</b> Cycles of Genesis runs on Windows PCs, so download it there: open <span class="hl">'+esc(link.replace(/^https?:\/\//,""))+'</span> on your PC and sign in with Steam.</div>'
 +'<a class="btn" target="_top" href="mailto:?subject='+encodeURIComponent("Cycles of Genesis playtest download")+'&body='+encodeURIComponent("Open this on my Windows PC and sign in with Steam: "+link)+'">Email me the link</a>'
 +'<button class="btn" id="copy">Copy link</button><p class="faint"><a href="#" data-dl="'+esc(b.name)+'">Download here anyway</a> ('+b.sizeMb+' MB)</p>'}
function full(){var b=D.builds[0],h="";
 if(!b)h+='<div class="panel"><h2>No build yet</h2><p class="dim">The next playtest build is on its way. Check the Discord.</p>'+discordBtn()+'</div>';
 else{h+='<div class="panel"><div class="tag">Latest build</div><h2>'+esc(b.name)+'</h2><p class="dim">Released '+day((b.notes&&b.notes.date)||b.added)+'</p>'+dlBlock(b)+'</div>';
  h+='<h3>How to install and play</h3><div class="panel"><ol class="steps"><li><b>Open Steam and sign in.</b> Keep it running the whole time, or the game won\'t start.</li><li><b>Download the launcher</b> above on your Windows PC and run <b>CyclesOfGenesisLauncher.exe</b>.</li><li>If Windows shows <b>Windows protected your PC</b>, click <b>More info</b>, then <b>Run anyway</b>. The playtest isn\'t signed yet.</li><li>Press <b>Sign in</b> in the launcher and sign in with Steam in your browser. It downloads the latest build, then press <b>Play</b>. New builds show up there by themselves.</li><li>Logs and replays upload by themselves. Found a bug? Use <b>REPORT BUG</b> in the main menu or the pause menu.</li><li>Stuck, or want to talk bugs and balance? Ask in the <a target="_blank" rel="noopener" data-ev="discord" href="'+esc(DISCORD)+'">Discord</a>.</li></ol><details><summary>Using the zip instead</summary><ol class="steps"><li>Download the zip above, then in your Downloads folder <b>right-click it &gt; Extract All</b>, somewhere easy like your Desktop.</li><li>Open the extracted folder and double-click the <b>Play</b> .bat file. Steam must be open.</li></ol></details></div>';
  h+='<h3>What\'s new</h3><div class="panel">'+notes(b.notes)+'</div>'}
 if(D.objectives&&D.objectives.length)h+='<h3>This week\'s objectives</h3><div class="grid">'+D.objectives.map(function(o){return '<div class="panel"><h4>'+esc(o.title)+'</h4><p class="dim">'+esc(o.description)+'</p><div class="row"><span><span class="pts">'+o.points+' pts</span>'+(o.trophy?' · <span class="trophy">'+esc(o.trophy)+'</span>':'')+'</span><span>'+o.completedBy+' done</span></div></div>'}).join("")+'</div>';
 var boards=(D.boards||[]).filter(function(x){return x.entries.length});if(D.season&&D.season.length)boards.unshift({title:"Season points",unit:"pts",entries:D.season});
 if(boards.length)h+='<h3>Leaderboards</h3><div class="grid">'+boards.map(function(x){return '<div class="panel"><h4>'+esc(x.title)+'</h4>'+x.entries.map(function(e,i){return '<div class="row"><span>'+(i+1)+'. '+esc(e.player)+'</span><span>'+e.value+(x.unit?" "+esc(x.unit):"")+'</span></div>'}).join("")+'</div>'}).join("")+'</div>';
 h+='<h3>Community</h3><div class="panel"><p>Chat with other testers and report problems that aren\'t in-game bugs.</p>'+discordBtn()+'</div>';
 h+='<h3>What the playtest collects</h3><div class="panel"><ul><li>Game logs and crash logs</li><li>Replays of your matches</li><li>Match stats and settings (map, AI, lobby and pause-menu settings, what you built and used)</li><li>PC specs (CPU, GPU, RAM), only while <b>SHARE PC SPECS</b> is on</li><li>Performance (frame rate, frame times)</li><li>Your Steam name and Steam ID, so leaderboards and objectives follow you between builds</li><li>Bug reports and screenshots you send</li></ul><p class="dim"><b>Why:</b> to find bugs and balance the game. <b>Where:</b> the developer\'s private Google Drive. Nothing is sold or shared. Change <b>UPLOADS</b> and <b>SHARE PC SPECS</b> any time under <b>DATA &amp; PRIVACY</b> in the game\'s main menu.</p></div>';
 if(D.builds.length>1)h+='<h3>Older builds</h3><div class="panel">'+D.builds.slice(1).map(function(o){return '<details><summary>'+esc(o.name)+' <span class="dim">'+day((o.notes&&o.notes.date)||o.added)+' · '+o.sizeMb+' MB</span></summary><p><a href="#" data-dl="'+esc(o.name)+'">Download '+esc(o.name)+'</a></p>'+notes(o.notes)+'</details>'}).join("")+'</div>';
 app.innerHTML=h;var c=document.getElementById("copy");if(c)c.onclick=function(){var l=selfUrl();(navigator.clipboard?navigator.clipboard.writeText(l):Promise.reject()).then(function(){toast("Link copied")},function(){prompt("Copy this link:",l)})}}
function render(){setWho();if(!D||D.status==="signedout")return signedOut();if(D.status!=="approved")return waiting();full()}
document.addEventListener("click",function(e){var d=e.target.closest("[data-dl]");if(d){e.preventDefault();download(d,d.dataset.dl);return}
 if(e.target.closest('[data-ev="discord"]'))api("ev",{event:"discord"}).catch(function(){})});
function download(el,build){var old=el.innerHTML;el.setAttribute("disabled","");el.innerHTML='<span class="spin"></span>Preparing your download…';
 api("dl",{build:build}).then(function(r){el.removeAttribute("disabled");el.innerHTML=old;if(!r||!r.ok){toast(r&&r.error||"Download failed");if(r&&r.signin){store("agetok",null);TOK=null;start()}return}
  if(C.mode==="gas"){var a=document.createElement("a");a.className=el.className||"btn";a.href=r.url;a.target="_blank";a.rel="noopener";a.textContent="Click to download";el.replaceWith(a);toast("Ready. The link works for 30 minutes.");return}
  location.href=r.url;toast("Download starting. The link works for 30 minutes.")}).catch(function(e){el.removeAttribute("disabled");el.innerHTML=old;toast("Download failed: "+(e&&e.message||e))})}
function openidParams(){var src=C.openid||null;if(!src){var q=new URLSearchParams(location.search);if(!q.get("openid.mode"))return null;src={};q.forEach(function(v,k){if(k.indexOf("openid.")===0)src[k]=v})}return src&&src["openid.mode"]?src:null}
function start(){TOK=load("agetok");app.innerHTML='<div class="panel"><span class="spin"></span>Loading…</div>';
 var oid=openidParams();
 var p=oid?api("steam",oid).then(function(r){if(C.mode!=="gas")history.replaceState(null,"",location.pathname);if(r&&r.token){TOK=r.token;store("agetok",r.token)}return r.ok?api("home"):r}):api("home");
 C.openid=null;
 p.then(function(r){if(!r||!r.ok){if(r&&r.signin){store("agetok",null);TOK=null;D={status:"signedout"};return render()}return err(r&&r.error)}D=r;if(D.discord)DISCORD=D.discord;document.getElementById("discordFoot").href=DISCORD;if(D.status==="signedout"){store("agetok",null);TOK=null}render()}).catch(err)}
document.getElementById("discordFoot").href=DISCORD;
start();
})();
</script>
