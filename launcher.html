<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cycles of Genesis launcher sign-in</title><meta name="robots" content="noindex">
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 70% 120%,#06142a 0,#020409 60%);color:#E6F2FA;font:500 17px/1.45 "Segoe UI",sans-serif}
.p{max-width:460px;margin:16px;padding:26px 24px;background:rgba(8,18,32,.8);border:1px solid rgba(95,212,255,.35)}
h1{margin:0 0 4px;font-size:13px;letter-spacing:.4em;color:#5FD4FF}h2{margin:0 0 10px;font-size:24px;letter-spacing:.08em;text-transform:uppercase}p{color:#8AA4B6;margin:0 0 18px}
a.b{display:block;padding:14px 18px;border-left:3px solid #5FD4FF;background:linear-gradient(90deg,rgba(95,212,255,.28),rgba(95,212,255,.04));color:#fff;text-decoration:none;font-weight:700;letter-spacing:.2em;text-transform:uppercase}
a.d{display:inline-block;margin-top:14px;color:#5FD4FF}
.sp{display:inline-block;width:14px;height:14px;margin-right:8px;border:2px solid #5FD4FF;border-right-color:transparent;border-radius:50%;animation:r .8s linear infinite;vertical-align:-2px}@keyframes r{to{transform:rotate(360deg)}}
</style></head><body><div class="p"><h1>CYCLES OF GENESIS</h1><h2 id="t">Signing in</h2><p id="m"><span class="sp"></span>One moment…</p><div id="x"></div></div>
<script>
(function(){
var API="https://script.google.com/macros/s/AKfycbwn0l1CTARsiFoh4kg3GSoG4jpKoVnlf0adAQ4S2ltLInWNQA0Z52X8t9k4m94AWrSIzg/exec";
var q=new URLSearchParams(location.search),port=parseInt(q.get("port"),10),state=q.get("state")||"";
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function show(t,m,html){document.getElementById("t").textContent=t;document.getElementById("m").textContent=m;document.getElementById("x").innerHTML=html||""}
if(!(port>=1024&&port<=65535)||!/^[A-Za-z0-9_-]{8,128}$/.test(state)){show("Sign-in link is broken","Close this tab and press SIGN IN in the launcher again.");return}
var back=location.origin+location.pathname+"?port="+port+"&state="+encodeURIComponent(state);
var done="http://127.0.0.1:"+port+"/done?state="+encodeURIComponent(state);
function steam(){var s={"openid.ns":"http://specs.openid.net/auth/2.0","openid.mode":"checkid_setup","openid.return_to":back,"openid.realm":location.origin,"openid.identity":"http://specs.openid.net/auth/2.0/identifier_select","openid.claimed_id":"http://specs.openid.net/auth/2.0/identifier_select"};
 return "https://steamcommunity.com/openid/login?"+new URLSearchParams(s).toString()}
var mode=q.get("openid.mode");
if(!mode){location.replace(steam());return}
if(mode!=="id_res"){show("Sign-in cancelled","Steam sign-in was cancelled.",'<a class="b" href="'+esc(steam())+'">Try again</a>');return}
var a=new URLSearchParams();q.forEach(function(v,k){if(k.indexOf("openid.")===0)a.set(k,v)});a.set("action","launcherSignIn");
history.replaceState(null,"",back);
fetch(API+"?"+a.toString()).then(function(r){return r.json()}).then(function(r){
 if(r.ok){show("Signed in as "+r.name,"Back to the launcher. You can close this tab.");location.replace(done+"&token="+encodeURIComponent(r.token));return}
 if(r.error==="not_approved"){show("Not on the playtest list yet","Hi "+r.name+". Your Steam account is not approved yet. Ask in the Discord and Matt can add you.",
  '<a class="b" href="'+esc(done+"&error=not_approved&steamId="+r.steamId)+'">Back to the launcher</a>'+(r.discord?'<a class="d" target="_blank" rel="noopener" href="'+esc(r.discord)+'">Join the Discord</a>':""));return}
 show("Sign-in failed",r.error||"Something went wrong.",'<a class="b" href="'+esc(steam())+'">Try again</a>');
}).catch(function(){show("Sign-in failed","Could not reach the playtest server. Check your connection.",'<a class="b" href="'+esc(steam())+'">Try again</a>')});
})();
</script></body></html>
